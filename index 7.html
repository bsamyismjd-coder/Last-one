<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BASAM · مراجعة مباريات الشطرنج</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
<style>
:root{--b:min(calc(100vw - 92px),500px);--bg:#16181d;--c:#21242b;--ln:#363b45;--tx:#eceae4;--mu:#9aa1ad;--ac:#e3b23c}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 12% 8%,rgba(227,178,60,.13),transparent),radial-gradient(520px 420px at 88% 92%,rgba(27,172,166,.12),transparent);animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(18px,-12px) scale(1.06)}}
header{padding:26px 16px 6px;text-align:center}
.lg{font-size:44px;line-height:1;display:inline-block;color:var(--ac);animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-6deg)}}
h1{margin:4px 0 0;font-size:26px}header p{margin:4px 0 0;color:var(--mu)}
.br{display:inline-block;margin-top:8px;padding:2px 14px;border:1px solid var(--ac);border-radius:20px;color:var(--ac);font-weight:800;letter-spacing:3px;font-size:13px}
main{max-width:1000px;margin:auto;padding:12px}
.c{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
#rv{animation:up .45s backwards}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.row{display:flex;gap:8px}.lb{display:block;margin-bottom:6px;color:var(--mu)}
input,textarea,select{background:#12141a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit}
input{flex:1;min-width:0;direction:ltr;font-size:16px}textarea{width:100%;margin:8px 0;direction:ltr}
button{background:var(--ac);color:#241a02;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.95)}button:disabled{opacity:.6}
button:focus-visible,input:focus-visible,select:focus-visible,.g:focus-visible{outline:2px solid #fff;outline-offset:2px}
details{margin-top:10px;color:var(--mu)}
#gl{max-height:300px;overflow:auto;margin-top:8px}
.g{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.g:hover{background:#2c3039}.g small{color:var(--mu)}
.t{font-weight:700;padding:0 8px;border-radius:5px;height:fit-content}
.t.w{background:#3f6b1d}.t.l{background:#7a2a28}.t.d{background:#55524c}
#lay{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
#bw{display:flex;gap:6px;direction:ltr;align-self:flex-start}
#eb{width:16px;height:var(--b);margin-top:28px;background:#111;display:flex;border-radius:4px;overflow:hidden}
#ef{background:#f2f2f2;height:50%;transition:height .3s}
.pl{height:28px;display:flex;align-items:center;gap:7px;font-size:13px}.pl small{color:var(--mu)}
.dt{width:11px;height:11px;border-radius:50%;border:1px solid #888}.dt.w{background:#fff}.dt.k{background:#111}
#bdw{position:relative;width:var(--b);height:var(--b)}
#bd{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
#bd .s:nth-child(1){border-top-left-radius:6px}#bd .s:nth-child(8){border-top-right-radius:6px}#bd .s:nth-child(57){border-bottom-left-radius:6px}#bd .s:nth-child(64){border-bottom-right-radius:6px}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.s{position:relative}
.s.l{background:#eeeed2}.s.d{background:#769656}
.lm::before,.bm::after{content:"";position:absolute;inset:0}
.lm::before{background:rgba(255,226,0,.45)}.bm::after{background:rgba(0,140,255,.5)}
.s i{font-style:normal;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)/8*.82);line-height:1;position:relative;z-index:1}

<script>
const SF='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},PV={p:1,n:3,b:3,r:5,q:9,k:0};
const L={book:['نظرية','#a88865','📖'],brilliant:['عبقرية','#1baca6','!!'],great:['رائعة','#5c8bb0','!'],best:['الأفضل','#81b64c','★'],excellent:['ممتازة','#96bc4b','👍'],good:['جيدة','#96af8b','✓'],inacc:['دقة ضعيفة','#f7c631','?!'],miss:['فرصة ضائعة','#ee6055','✕'],mistake:['خطأ','#ffa459','?'],blunder:['خطأ فادح','#ca3431','??']};
const OR=Object.keys(L);
const D={book:'نقلة من نظرية الافتتاحات',brilliant:'تضحية ذكية وصحيحة — نقلة عبقرية!',great:'نقلة حاسمة، أفضل بكثير من البدائل',best:'هذه أفضل نقلة في الوضع',excellent:'نقلة ممتازة وقريبة جداً من الأفضل',good:'نقلة جيدة',inacc:'دقة ضعيفة',miss:'فوّت فرصة لاستغلال خطأ الخصم',mistake:'خطأ يكلّف تقدماً واضحاً',blunder:'خطأ فادح يغيّر مسار المباراة'};
const wp=c=>50+50*(2/(1+Math.exp(-0.00368208*c))-1);

let G={fens:[],mv:[],ev:[],mt:[],bm:[],e2:[],cl:[],ac:[],i:0,flip:false,tok:0,h:{},snd:st.get('bs_s')!=='0',best:st.get('bs_b')!=='0',timer:null},GS=[],sf,sfR,pending,AC;
$('yr').textContent=new Date().getFullYear();$('u').value=st.get('bs_u')||'';

async function loadGames(){
 const u=$('u').value.trim().toLowerCase().replace(/^@/,'');
 if(!u){$('u').focus();return}
 st.set('bs_u',u);$('go').disabled=true;$('gl').textContent='جاري التحميل…';
 try{
  const r=await fetch('https://api.chess.com/pub/player/'+encodeURIComponent(u)+'/games/archives');
  if(r.status===404){$('gl').textContent='ما لقيت لاعب بهذا الاسم. تأكد من الكتابة.';return}
  if(!r.ok)throw new Error(r.status);
  const a=(await r.json()).archives||[];
  if(!a.length){$('gl').textContent='لا توجد مباريات لهذا اللاعب.';return}
  GS=[];
  for(const url of a.slice(-3).reverse()){
   const x=await fetch(url);if(!x.ok)continue;
   GS=GS.concat((await x.json()).games.slice().reverse().filter(g=>g.pgn&&g.rules==='chess'));
   if(GS.length>=30)break;
  }
  GS=GS.slice(0,30);
  $('gl').innerHTML=GS.map((g,k)=>{
   const me=g.white.username.toLowerCase()===u?'white':'black',op=g[me==='white'?'black':'white'],res=g[me].result;
   const t=res==='win'?['فوز','w']:['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'].includes(res)?['تعادل','d']:['خسارة','l'];
   return `<div class="g" role="button" tabindex="0" data-k="${k}" data-me="${me}"><span>${esc(op.username)} <small>(${op.rating}) · ${esc(g.time_class)} · ${new Date(g.end_time*1000).toLocaleDateString('ar')}</small></span><span class="t ${t[1]}">${t[0]}</span></div>`}).join('')||'لا توجد مباريات شطرنج عادية.';
 }catch(e){$('gl').textContent='تعذّر جلب المباريات. تأكد من الاتصال ثم أعد المحاولة.'}
 finally{$('go').disabled=false}
}
const pick=e=>{const d=e.target.closest('.g');if(d)loadPGN(GS[+d.dataset.k].pgn,d.dataset.me==='black')};
$('gl').onclick=pick;$('gl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e)}};

function loadPGN(pgn,flip){
 const g=new Chess();
 if(!pgn||!pgn.trim()||!g.load_pgn(pgn)){alert('PGN غير صالح');return}
 const mv=g.history({verbose:true});
 if(!mv.length){alert('لا توجد نقلات في هذا الـ PGN');return}
 const h=g.header(),c=h.FEN&&h.SetUp==='1'?new Chess(h.FEN):new Chess(),f=[c.fen()];
 mv.forEach(m=>{c.move({from:m.from,to:m.to,promotion:m.promotion});f.push(c.fen())});
 if(flip===null){const u=$('u').value.trim().toLowerCase();flip=!!u&&String(h.Black||'').toLowerCase()===u}
 stopAuto();G={...G,fens:f,mv,sans:mv.map(m=>m.san),i:0,flip,h};
 $('ti').textContent=(h.White||'؟')+' ضد '+(h.Black||'؟')+(h.Result?'  ·  '+h.Result:'');
 $('rv').hidden=false;$('rv').scrollIntoView({behavior:'smooth'});
 names();renderBoard(null);renderInfo();upd();run();
}
$('rp').onclick=()=>loadPGN($('pgn').value,null);
$('u').onkeydown=e=>{if(e.key==='Enter')loadGames()};$('go').onclick=loadGames;
$('dp').onchange=()=>G.fens.length&&run();

function engine(){
 if(sfR)return sfR;
 sfR=(async()=>{
  const r=await fetch(SF);if(!r.ok)throw new Error('sf');
  const w=new Worker(URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'})));
  const wait=t=>new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('timeout')),40000);w.onerror=()=>{clearTimeout(to);rej(new Error('worker'))};w.onmessage=e=>{if(typeof e.data==='string'&&e.data.indexOf(t)===0){clearTimeout(to);res()}}});
  let q=wait('uciok');w.postMessage('uci');await q;
  w.postMessage('setoption name MultiPV value 2');w.postMessage('setoption name Hash value 32');
  q=wait('readyok');w.postMessage('isready');await q;
  sf=w;return w;
 })();
 sfR.catch(()=>{sfR=null});return sfR;
}
function evalFen(fen,d){
 const p=new Promise((res,rej)=>{
  const wt=fen.split(' ')[1]==='w',pv={};
  sf.onerror=()=>rej(new Error('worker'));
  sf.onmessage=e=>{
   const l=typeof e.data==='string'?e.data:'';
   if(l.startsWith('info')){
    const m=l.match(/score (cp|mate) (-?\d+)/);
    if(m&&!/lowerbound|upperbound/.test(l))pv[+((l.match(/multipv (\d+)/)||[])[1]||1)]={t:m[1],v:+m[2]};
   }else if(l.startsWith('bestmove')){
    const b=l.split(' ')[1],cv=x=>{if(!x)return null;const s=x.t==='mate'?(x.v>0?1000:-1000):Math.max(-1000,Math.min(1000,x.v));return wt?s:-s},x1=pv[1];
    const c=cv(x1);
    res({cp:c==null?0:c,mate:x1&&x1.t==='mate'?(wt?x1.v:-x1.v):null,cp2:cv(pv[2]),best:b&&b!=='(none)'?b:null});
   }
  };
  sf.postMessage('position fen '+fen);sf.postMessage('go depth '+d);
 });
 pending=p;return p;
}
/* كشف التضحية الحقيقية: بحث التبادلات (captures فقط) بعد النقلة */
function mat(ch){let s=0;for(const r of ch.board())for(const p of r)if(p)s+=(p.color==='w'?1:-1)*PV[p.type];return s}
function qs(ch,a,b,d){
 const sp=(ch.turn()==='w'?1:-1)*mat(ch);
 if(d===0||sp>=b)return sp;
 if(sp>a)a=sp;
 const ms=ch.moves({verbose:true}).filter(m=>m.captured||m.promotion);
 ms.sort((x,y)=>(PV[y.captured||'p']*10-PV[y.piece])-(PV[x.captured||'p']*10-PV[x.piece]));
 for(const m of ms){ch.move({from:m.from,to:m.to,promotion:m.promotion});const s=-qs(ch,-b,-a,d-1);ch.undo();if(s>=b)return s;if(s>a)a=s}
 return a;
}
function isSac(i){
 const sg=G.mv[i-1].color==='w'?1:-1,base=sg*mat(new Chess(G.fens[i-1]));
 return -qs(new Chess(G.fens[i]),-1000,1000,8)<=base-2;
}
let BK=new Set(),OPN=new Map(),bkP,CA=new Map();
function loadBook(){
 return bkP||(bkP=Promise.all([...'abcde'].map(x=>fetch('https://raw.githubusercontent.com/lichess-org/chess-openings/master/'+x+'.tsv').then(r=>r.ok?r.text():''))).then(ts=>{
  ts.forEach(t=>t.split('\n').slice(1).forEach(l=>{
   const p=l.split('\t');if(p.length<3)return;
   const m=p[2].replace(/\d+\.+/g,' ').trim().split(/\s+/).filter(Boolean);
   for(let j=1;j<=m.length;j++)BK.add(m.slice(0,j).join(' '));
   if(m.length)OPN.set(m.join(' '),p[1]);
  }));
 }).catch(()=>{}));
}
function opName(i){for(let j=i;j>0;j--){const n=OPN.get(G.sans.slice(0,j).join(' '));if(n)return n}return ''}
async function ev1(fen,d){const k=fen+'|'+d;if(CA.has(k))return CA.get(k);const r=await evalFen(fen,d);CA.set(k,r);return r}
function classify(i){
 const m=G.mv[i-1],mw=m.color==='w',mp=c=>mw?wp(c):100-wp(c);
 const b0=mp(G.ev[i-1]),b1=mp(G.ev[i]),loss=Math.max(0,b0-b1);
 G.ac[i]=Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*loss)-3.1669));
 if(BK.has(G.sans.slice(0,i).join(' '))){G.ac[i]=100;return 'book'}
 const best=(m.from+m.to+(m.promotion||''))===G.bm[i-1];
 let k=best?'best':loss<=2?'excellent':loss<=5?'good':loss<=10?'inacc':loss<=20?'mistake':'blunder';
 if((best||loss<=2)&&b1>=45&&b0<=92&&isSac(i))k='brilliant';
 else if((best||loss<=1)&&G.e2[i-1]!=null&&b0<=92){
  const pm=G.mv[i-2];
  if(b0-mp(G.e2[i-1])>=12&&!(pm&&pm.captured&&pm.to===m.to))k='great';
 }else if(k==='inacc'||k==='mistake'){
  const pk=G.cl[i-1];
  if((pk==='mistake'||pk==='blunder')&&b0>=60&&loss>=8)k='miss';
 }
 return k;
}
async function run(){
 const tok=++G.tok,d=+$('dp').value;
 if(sf&&pending){sf.postMessage('stop');try{await pending}catch(e){}}
 if(tok!==G.tok)return;
 G.ev=[];G.mt=[];G.bm=[];G.e2=[];G.cl=[];G.ac=[];
 buildML();updateActive();summary();graph();renderBoard(null);renderInfo();
 $('bar').hidden=false;$('bi').style.width='0';$('st').textContent='جاري تحميل المحرك…';
 loadBook();try{await engine();await loadBook()}catch(e){$('st').textContent='تعذّر تحميل Stockfish. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.';return}
 if(tok!==G.tok)return;
 const n=G.fens.length,pre=j=>G.sans.slice(0,j).join(' '),sh=i=>i+1<n&&(i===0||BK.has(pre(i)))&&BK.has(pre(i+1));
 try{
  for(let i=0;i<n;i++){
   if(tok!==G.tok)return;
   const ch=new Chess(G.fens[i]);let r;
   if(ch.in_checkmate())r={cp:ch.turn()==='w'?-1000:1000,mate:0,cp2:null,best:null};
   else if(ch.game_over())r={cp:0,mate:null,cp2:null,best:null};
   else r=await ev1(G.fens[i],sh(i)?8:d);
   if(tok!==G.tok)return;
   G.ev[i]=r.cp;G.mt[i]=r.mate;G.bm[i]=r.best;G.e2[i]=r.cp2;
   if(i){G.cl[i]=classify(i);setMB(i)}
   $('bi').style.width=((i+1)/n*100)+'%';$('st').textContent='جاري التحليل '+(i+1)+' / '+n;
   if(i===G.i){renderBoard(null);renderInfo()}
   summary();graph();
  }
  const dd=Math.min(d+2,18),fl=new Set();
  for(let i=1;i<n;i++)if(['mistake','blunder','miss','brilliant','great'].includes(G.cl[i])){if(fl.size<16){fl.add(i-1);fl.add(i)}}
  let c=0;
  for(const i of fl){
   if(tok!==G.tok)return;
   $('st').textContent='تدقيق اللحظات الحاسمة بعمق '+dd+' — '+(++c)+' / '+fl.size;
   if(new Chess(G.fens[i]).game_over())continue;
   const r=await ev1(G.fens[i],dd);
   if(tok!==G.tok)return;
   G.ev[i]=r.cp;G.mt[i]=r.mate;G.bm[i]=r.best;G.e2[i]=r.cp2;
  }
  for(let i=1;i<n;i++){G.cl[i]=classify(i);setMB(i)}
  renderBoard(null);renderInfo();summary();graph();
 }catch(e){if(tok===G.tok)$('st').textContent='توقف المحرك بشكل غير متوقع. أعد المحاولة.';return}
 $('bar').hidden=true;$('st').textContent='اكتملت المراجعة ✓';
}

function names(){
 const w={n:G.h.White||'الأبيض',r:G.h.WhiteElo,c:'w'},b={n:G.h.Black||'الأسود',r:G.h.BlackElo,c:'k'};
 const f=p=>`<i class="dt ${p.c}"></i><b>${esc(p.n)}</b>${p.r?` <small>(${esc(p.r)})</small>`:''}`;
 $('pt').innerHTML=f(G.flip?w:b);$('pb').innerHTML=f(G.flip?b:w);
}
function renderBoard(last){
 const i=G.i,fen=G.fens[i];if(!fen)return;
 const col=n=>{const F='abcdefgh'.indexOf(n[0]);return G.flip?7-F:F},row=n=>{const R=+n[1]-1;return G.flip?R:7-R};
 const sq={};
 fen.split(' ')[0].split('/').forEach((r,y)=>{let x=0;for(const c of r){if(c>='1'&&c<='8')x+=+c;else sq['abcdefgh'[x++]+(8-y)]=c}});
 const m=i?G.mv[i-1]:null,k=G.cl[i];
 const bu=i&&k&&G.best&&!['book','best','brilliant','great'].includes(k)?G.bm[i-1]:'';
 let to='',from='';
 if(last!=null){const mm=i>last?G.mv[i-1]:G.mv[i];if(mm){to=i>last?mm.to:mm.from;from=i>last?mm.from:mm.to}}
 let h='';
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){
  const F=G.flip?7-f:f,R=G.flip?r:7-r,n='abcdefgh'[F]+(R+1),p=sq[n];
  const cls=`s ${(F+R)%2?'l':'d'}${m&&(n===m.from||n===m.to)?' lm':''}${bu&&(n===bu.slice(0,2)||n===bu.slice(2,4))?' bm':''}`;
  const an=p&&n===to?` mv" style="--dx:${col(from)-col(n)};--dy:${row(from)-row(n)}`:'';
  h+=`<div class="${cls}">${f===0?`<span class="co rk">${R+1}</span>`:''}${r===7?`<span class="co fl">${'abcdefgh'[F]}</span>`:''}${p?`<i class="${p<'a'?'w':'k'} pc-${p.toLowerCase()}${an}"></i>`:''}${m&&k&&n===m.to?`<span class="bg" style="background:${L[k][1]}">${L[k][2]}</span>`:''}</div>`;
 }
 $('bd').innerHTML=h;
 let ar='';
 if(bu){
  const c=n=>[col(n)*10+5,row(n)*10+5],[x1,y1]=c(bu.slice(0,2)),[x2,y2]=c(bu.slice(2,4)),dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const ex=x2-ux*1.2,ey=y2-uy*1.2,bx=ex-ux*4,by=ey-uy*4,px=-uy*2.6,py=ux*2.6;
  ar=`<g fill="rgba(0,140,255,.85)" stroke="rgba(0,140,255,.85)"><line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke-width="2.2" stroke-linecap="round"/><polygon stroke="none" points="${ex},${ey} ${bx+px},${by+py} ${bx-px},${by-py}"/></g>`;
 }
 $('ar').innerHTML=ar;
}
function evTxt(i){const e=G.ev[i];if(e===undefined)return '';const t=G.mt[i];if(t===0)return 'كش مات';if(t!=null)return (t>0?'+':'-')+'#'+Math.abs(t);return (e>0?'+':'')+(e/100).toFixed(1)}
function bestSan(i){const u=G.bm[i-1];if(!u)return '';try{const o=new Chess(G.fens[i-1]).move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});return o?o.san:''}catch(e){return ''}}
function renderInfo(){
 const i=G.i;if(!G.fens.length)return;
 const e=G.ev[i];
 $('ef').style.height=(e===undefined?50:wp(e))+'%';
 $('eb').style.flexDirection=G.flip?'column':'column-reverse';
 let h='<b>الوضع الابتدائي</b>';
 if(i){
  const m=G.mv[i-1],k=G.cl[i];
  h=`<div class="mt"><b dir="ltr">${Math.ceil(i/2)}${m.color==='w'?'.':'...'} ${esc(m.san)}</b>`;
  if(k)h+=`<span class="tg" style="background:${L[k][1]}">${L[k][2]}</span><b style="color:${L[k][1]}">${L[k][0]}</b>`;
  h+='</div>';
  if(k){
   h+=`<div class="ds">${D[k]}`;if(k==='book'){const o=opName(i);if(o)h+=' — <b dir="ltr">'+esc(o)+'</b>'}
   const bs=['book','best','brilliant','great'].includes(k)?'':bestSan(i);
   if(bs&&bs!==m.san)h+=` — الأفضل: <b dir="ltr">${esc(bs)}</b>`;
   h+='</div>';
  }else h+='<div class="ds">بانتظار التحليل…</div>';
 }
 if(e!==undefined)h+=`<div class="ev">التقييم: <b dir="ltr">${evTxt(i)}</b></div>`;
 $('cm').innerHTML=h;
}
function buildML(){
 let h='';
 G.mv.forEach((x,j)=>{const k=j+1;if(x.color==='w')h+=`<b>${Math.ceil(k/2)}.</b>`;h+=`<button type="button" data-i="${k}">${esc(x.san)}<span class="mb"></span></button>`});
 $('ml').innerHTML=h;
}
function setMB(k){const b=$('ml').querySelector('[data-i="'+k+'"] .mb'),c=G.cl[k];if(b&&c){b.textContent=L[c][2];b.style.background=L[c][1];b.style.display='inline-flex'}}
function updateActive(){
 const ml=$('ml'),o=ml.querySelector('.a');if(o)o.classList.remove('a');
 const a=G.i?ml.querySelector('[data-i="'+G.i+'"]'):null;if(!a)return;
 a.classList.add('a');
 /* تمرير القائمة نفسها فقط — بدون تحريك الصفحة */
 const top=a.offsetTop,bot=top+a.offsetHeight;
 if(top<ml.scrollTop)ml.scrollTop=top-4;else if(bot>ml.scrollTop+ml.clientHeight)ml.scrollTop=bot-ml.clientHeight+4;
}
function accOf(c){
 const a=[];G.mv.forEach((m,j)=>{if(m.color===c&&G.ac[j+1]!==undefined)a.push(G.ac[j+1])});
 if(!a.length)return null;
 return (a.reduce((x,y)=>x+y,0)/a.length+a.length/a.reduce((x,y)=>x+1/Math.max(y,1),0))/2;
}
function summary(){
 let h='';
 for(const [c,nm] of [['w',G.h.White||'الأبيض'],['b',G.h.Black||'الأسود']]){
  const k={};G.mv.forEach((m,j)=>{const x=G.cl[j+1];if(m.color===c&&x)k[x]=(k[x]||0)+1});
  const a=accOf(c);
  h+=`<div class="pc"><b class="pn">${esc(nm)}</b><div class="acc">${a==null?'–':Math.round(a)+'%'}<small>الدقة</small></div><div class="cn">${OR.map(t=>`<span class="${k[t]?'':'z'}"><i style="background:${L[t][1]}">${L[t][2]}</i>${L[t][0]}<b>${k[t]||0}</b></span>`).join('')}</div></div>`;
 }
 $('sum').innerHTML=G.fens.length?h:'';
}
function graph(){
 const n=G.fens.length,E=G.ev;if(n<2||!E.length){$('gr').innerHTML='';return}
 const x=i=>i/(n-1)*300;let p='';
 E.forEach((e,i)=>{p+=x(i)+','+(100-wp(e))+' '});
 $('gr').innerHTML=`<polygon points="0,100 ${p}${x(E.length-1)},100" fill="#e8e8e8" opacity=".9"/><line x1="0" x2="300" y1="50" y2="50" stroke="#888" stroke-dasharray="3 3" stroke-width="1"/><line x1="${x(G.i)}" x2="${x(G.i)}" y1="0" y2="100" stroke="#e3b23c" stroke-width="2"/>`;
}
function snd(k){
 if(!G.snd)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime;
  const nz=(dur,vol,fc)=>{const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let x=0;x<n;x++)d[x]=(Math.random()*2-1)*Math.pow(1-x/n,3);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t)};
  const tn=(fr,at,du)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.14,t+at);g.gain.exponentialRampToValueAtTime(.001,t+at+du);o.connect(g);g.connect(AC.destination);o.start(t+at);o.stop(t+at+du+.02)};
  if(k==='c')nz(.09,1.2,2600);else if(k==='k'){nz(.06,.8,1800);tn(880,.02,.18)}else if(k==='m'){tn(523,0,.25);tn(659,.08,.25);tn(784,.16,.4)}else nz(.06,.7,1400);
 }catch(e){}
}
function go(i){
 if(!G.fens.length)return;
 i=Math.max(0,Math.min(G.fens.length-1,i));
 const last=G.i;G.i=i;
 renderBoard(Math.abs(i-last)===1?last:null);renderInfo();updateActive();graph();
 if(i!==last){const m=i>last?G.mv[i-1]:G.mv[i];if(m)snd(m.san.includes('#')?'m':m.san.includes('+')?'k':m.captured?'c':'x')}
}
function startAuto(){if(G.i>=G.fens.length-1)go(0);G.timer=setInterval(()=>{if(G.i>=G.fens.length-1)stopAuto();else go(G.i+1)},850);upd()}
function stopAuto(){clearInterval(G.timer);G.timer=null;upd()}
function upd(){$('ba').textContent=G.timer?'⏸ إيقاف':'⏯ تشغيل';$('bh').textContent=G.best?'💡 الأفضل: نعم':'💡 الأفضل: لا';$('bm').textContent=G.snd?'🔊 صوت':'🔇 صوت'}
function act(a){
 if(!G.fens.length)return;
 if(a==='s')go(0);else if(a==='e')go(G.fens.length-1);else if(a==='p')go(G.i-1);else if(a==='n')go(G.i+1);
 else if(a==='f'){G.flip=!G.flip;names();renderBoard(null);renderInfo()}
 else if(a==='a')G.timer?stopAuto():startAuto();
 else if(a==='h'){G.best=!G.best;st.set('bs_b',G.best?'1':'0');renderBoard(null);upd()}
 else if(a==='m'){G.snd=!G.snd;st.set('bs_s',G.snd?'1':'0');upd();snd('x')}
}
$('ct').onclick=e=>{const b=e.target.closest('button[data-a]');if(b){if(b.dataset.a.length&&'snpe'.includes(b.dataset.a))stopAuto();act(b.dataset.a)}};
$('ml').onclick=e=>{const b=e.target.closest('[data-i]');if(b){stopAuto();go(+b.dataset.i)}};
$('gr').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();stopAuto();go(Math.round((e.clientX-r.left)/r.width*(G.fens.length-1)))};
document.onkeydown=e=>{
 if(!G.fens.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k={ArrowLeft:'p',ArrowRight:'n',ArrowUp:'s',ArrowDown:'e'}[e.key];if(k){e.preventDefault();stopAuto();act(k)}
};
upd();
